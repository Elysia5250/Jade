name: release

# Push a tag to publish: the installer resolves the latest release and expects
# assets named envoy-v<version>-<target>.tar.gz (+ .sha256).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    # ARM Linux runners are only free on public repos, and Intel macOS runners
    # are being retired; a missing leg must not block the other assets.
    continue-on-error: ${{ matrix.os == 'ubuntu-24.04-arm' || matrix.os == 'macos-13' }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Check that the tag matches the workspace version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match workspace version $version" >&2
            exit 1
          fi

      - name: Test
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --release --locked -p envoy-cli

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="envoy-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "stage/$name"
          cp target/release/envoy "stage/$name/envoy"
          if [ -f LICENSE ]; then
            cp LICENSE "stage/$name/LICENSE"
          fi
          tar -C stage -czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          ls -l "$name.tar.gz"*

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            envoy-*.tar.gz
            envoy-*.tar.gz.sha256
          fail_on_unmatched_files: true
