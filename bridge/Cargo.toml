[package]
name = "envoy-bridge"
description = "Conduit fabric adapter: mounts the envoy agent service on a device session and routes local control requests to peers"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

# Standalone workspace: this crate is the *assembly* of envoy and conduit, and
# neither project depends on the other. Keep `cargo build` at the envoy root
# free of conduit.
[workspace]

[[bin]]
name = "envoy-bridge"
path = "src/main.rs"

[dependencies]
envoy-core = { path = "../crates/envoy-core" }
envoy-proto = { path = "../crates/envoy-proto" }
envoy-service = { path = "../crates/envoy-service" }
conduit-core = { path = "../../conduit/crates/conduit-core" }
conduit-fabric = { path = "../../conduit/crates/conduit-fabric" }
conduit-net = { path = "../../conduit/crates/conduit-net" }
conduit-proto = { path = "../../conduit/crates/conduit-proto" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
